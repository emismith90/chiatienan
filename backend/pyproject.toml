[project]
name = "chiatienan"
version = "0.1.0"
description = "PWA lunch-splitting bot (Pi agent sidecar + deterministic ledger)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "sqlalchemy>=2",
    "python-multipart>=0.0.9",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "kernos", "kernos.*", "ledger_core", "ledger_core.*", "packs", "packs.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
