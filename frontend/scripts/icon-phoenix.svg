<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#CC4E33"/>
  <g fill="#FFFFFF">
    <!-- left wing: upswept crescent with feather notches on the inner edge -->
    <path d="M 236 296
             C 190 300, 140 284, 112 240
             C 96 214, 92 182, 100 150
             C 110 186, 128 208, 152 218
             C 140 194, 136 168, 142 140
             C 154 176, 172 198, 196 208
             C 188 186, 188 162, 196 138
             C 208 174, 224 196, 244 206
             Z"/>
    <!-- right wing (mirror) -->
    <path d="M 276 296
             C 322 300, 372 284, 400 240
             C 416 214, 420 182, 412 150
             C 402 186, 384 208, 360 218
             C 372 194, 376 168, 370 140
             C 358 176, 340 198, 316 208
             C 324 186, 324 162, 316 138
             C 304 174, 288 196, 268 206
             Z"/>
    <!-- head + crest -->
    <circle cx="256" cy="150" r="26"/>
    <path d="M 250 128 C 246 108, 254 94, 268 84 C 262 100, 266 112, 276 122 Z"/>
    <!-- beak -->
    <path d="M 278 144 L 306 152 L 278 162 Z"/>
    <!-- body: teardrop from below the head down, wide enough to carry the đ -->
    <path d="M 256 164
             C 294 198, 308 244, 300 296
             C 293 332, 276 354, 256 370
             C 236 354, 219 332, 212 296
             C 204 244, 218 198, 256 164
             Z"/>
    <!-- tail: three flame streamers flowing out of the body, reborn-from-fire -->
    <path d="M 256 344
             C 272 380, 272 414, 254 444
             C 256 418, 250 400, 238 388
             C 248 376, 254 362, 256 344 Z"/>
    <path d="M 234 336
             C 232 366, 220 390, 198 404
             C 210 386, 212 370, 206 356
             C 218 352, 228 346, 234 336 Z"/>
    <path d="M 278 336
             C 280 366, 292 390, 314 404
             C 302 386, 300 370, 306 356
             C 294 352, 284 346, 278 336 Z"/>
  </g>
  <!-- đ (dong sign, no font dependency): bowl + right stem + crossbar, drawn
       in the background color over the chest so it reads as a cutout -->
  <g stroke="#CC4E33" stroke-width="10" stroke-linecap="round" fill="none">
    <circle cx="247" cy="302" r="16"/>
    <path d="M 263 256 L 263 318"/>
    <path d="M 247 264 L 281 264"/>
  </g>
</svg>
